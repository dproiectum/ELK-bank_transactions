input {
  file {
    path => "/var/log/meridian/transactions.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["transactions"]
  }

  file {
    path => "/var/log/meridian/auth.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["auth"]
  }

  file {
    path => "/var/log/meridian/atm.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["atm"]
  }
}

filter {
  mutate {
    add_field => { "raw_line" => "%{message}" }
  }

  if "transactions" in [tags] {
    kv {
      source => "message"
      field_split => " "
      value_split => "="
    }

    if ![ts] or ![ev] or ![id] or ![amount] or ![currency] or ![country] or ![card_present] or ![merchant] or ![status] {
      mutate {
        add_tag => ["_bankparsefailure"]
        add_field => { "deadletter_reason" => "invalid_transaction_line" }
      }
    } else {
      date {
        match => [ "ts", "ISO8601" ]
        target => "@timestamp"
      }

      mutate {
        rename => {
          "id" => "transaction_id"
          "ev" => "event_type"
        }
        convert => {
          "amount" => "float"
          "card_present" => "boolean"
        }
        add_field => { "source_type" => "transactions" }
        remove_field => [ "ts" ]
      }
    }
  }

  if "auth" in [tags] {
    json {
      source => "message"
    }

    if "_jsonparsefailure" in [tags] or ![ts] or ![event] or ![user] or ![channel] or ![result] or ![ip] {
      mutate {
        add_tag => ["_bankparsefailure"]
        add_field => { "deadletter_reason" => "invalid_auth_line" }
      }
    } else {
      date {
        match => [ "ts", "ISO8601" ]
        target => "@timestamp"
      }

      geoip {
        source => "ip"
      }

      mutate {
        rename => {
          "event" => "event_type"
          "user" => "user_id"
          "ip" => "client_ip"
        }
        add_field => { "source_type" => "auth" }
        remove_field => [ "ts" ]
      }
    }
  }

  if "atm" in [tags] {
    if [message] =~ /^ts,atm_id,city,op,amount,result$/ {
      mutate {
        add_tag => ["_bankparsefailure"]
        add_field => { "deadletter_reason" => "csv_header" }
      }
    } else {
      csv {
        columns => [ "ts", "atm_id", "city", "op", "amount", "result" ]
        convert => {
          "amount" => "float"
        }
      }

      if "_csvparsefailure" in [tags] or ![ts] or ![atm_id] or ![city] or ![op] or ![amount] or ![result] {
        mutate {
          add_tag => ["_bankparsefailure"]
          add_field => { "deadletter_reason" => "invalid_atm_line" }
        }
      } else {
        date {
          match => [ "ts", "ISO8601" ]
          target => "@timestamp"
        }

        mutate {
          add_field => { "source_type" => "atm" }
          remove_field => [ "ts" ]
        }
      }
    }
  }
}

output {
  if "_bankparsefailure" in [tags] or "_grokparsefailure" in [tags] or "_jsonparsefailure" in [tags] or "_csvparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bank-deadletter-%{+YYYY.MM.dd}"
    }
  } else if "transactions" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bank-transactions-%{+YYYY.MM.dd}"
    }
  } else if "auth" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bank-auth-%{+YYYY.MM.dd}"
    }
  } else if "atm" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bank-atm-%{+YYYY.MM.dd}"
    }
  }
}
